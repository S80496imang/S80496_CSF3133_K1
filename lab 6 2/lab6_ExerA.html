<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Paper, Scissors</title>
  <!-- Link external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header section with title and short instruction -->
  <header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
  </header>

  <!-- Player name input and Start Game button -->
  <section class="player-section">
    <label for="playerName">Your name:</label>
    <input type="text" id="playerName" placeholder="Enter your name">
    <button type="button" onclick="startGame()">Start Game</button>
    <p id="welcomeMsg"></p>
  </section>

  <!-- Game choice buttons and choice images -->
  <section class="game-section">
    <div class="choices">
      <button type="button" onclick="playRound('rock')">Rock</button>
      <button type="button" onclick="playRound('paper')">Paper</button>
      <button type="button" onclick="playRound('scissors')">Scissors</button>
    </div>

    <div class="arena">
      <div class="choice-card">
        <p><strong>You</strong></p>
        <img id="playerImg" src="rock.png" alt="Player choice">
      </div>
      <span class="vs">VS</span>
      <div class="choice-card">
        <p><strong>Computer</strong></p>
        <img id="computerImg" src="rock.png" alt="Computer choice">
      </div>
    </div>
  </section>

  <!-- Round result and scoreboard -->
  <section class="result-section">
    <p id="result"></p>
    <p class="scoreboard">
      Wins: <span id="wins">0</span> |
      Losses: <span id="losses">0</span> |
      Draws: <span id="draws">0</span>
    </p>
  </section>

  <!-- Round history table and control buttons -->
  <section class="history-section">
    <h2>History</h2>
    <table id="history">
      <thead>
        <tr>
          <th>Round</th>
          <th>You</th>
          <th>Computer</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="controls">
      <button type="button" onclick="showSummary()">Show Summary</button>
      <button type="button" onclick="resetGame()">Reset</button>
    </div>
    <p id="summary"></p>
  </section>

  <!-- Footer with start time and copyright -->
  <footer>
    <p id="startTime"></p>
    <p>&copy; 2026 Computer Science Club</p>
  </footer>

  <!-- Link external JavaScript file before closing body -->
  <script src="game.js"></script>
</body>
</html>
