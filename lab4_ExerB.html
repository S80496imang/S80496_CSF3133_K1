<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Café Campus</title>
    <!-- Linked external CSS file (Part 2) -->
    <link rel="stylesheet" href="cafe.css">
    <style type="text/css">
        /* Internal CSS fixes */
        h1 {
            text-decoration: overline;
        }

        p {
            color: #333333;
            text-align: justify;
        }

        .intro {
            font-size: 18px;
            background-color: #FDEBD0;
            padding: 10px;
        }

        .highlight {
            font-weight: bold;
            color: #C0392B;
        }
    </style>
</head>
<body>

    <!-- 
      Error Identification List:
      1. Line 7: CSS comment syntax standard used inside <style> tag instead of /* ... */.
      2. Line 9: Invalid property value `list-style-type: no;` (should be `none`).
      3. Lines 13-16: Incorrect link state order (should be :link -> :visited -> :hover -> :active).
      4. Line 17: Invalid property value `text-decoration: overlined;` (should be `overline`).
      5. Line 18: Missing colon `:` after color property `color #333333;`.
      6. Line 22: Missing closing curly bracket `}` for `#intro`.
      7. Line 34: Missing `#` in `href="menu"`.
      8. Line 39: Class mismatch: HTML used `class="intro"` while CSS defined `#intro`.
      9. Lines 42 & 46: Duplicate ID `id="item"` used on multiple elements.
      10. Line 54: Invalid video source `type="mp4"` and missing `controls` attribute.
    -->

    <header>
        <h1>e-Café Campus</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#feedback">Feedback</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section id="menu">
            <h2>Today's Menu</h2>
            <p class="intro">Freshly brewed coffee and local delights every day.</p>

            <article class="item">
                <h3>Kopi Tarik</h3>
                <p>Price: <span class="old-price">RM 4.50</span> <span class="highlight">RM 3.50</span></p>
            </article>

            <article class="item">
                <h3>Nasi Lemak</h3>
                <p>Price: <span class="old-price">RM 6.50</span> <span class="highlight">RM 5.00</span></p>
            </article>
        </section>

        <!-- Video Section with figure and figcaption (Part 2) -->
        <section id="video">
            <h2>Watch Our Story</h2>
            <figure>
                <video width="400" height="300" controls>
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <figcaption>Discover how we brew our signature campus coffee daily.</figcaption>
            </figure>
        </section>

        <!-- New Feedback Form Section (Part 2) -->
        <section id="feedback">
            <h2>Customer Feedback</h2>
            <form class="feedback-form" action="#" method="post">
                <div class="form-group">
                    <label for="fb-name">Name:</label>
                    <input type="text" id="fb-name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="fb-email">E-mail:</label>
                    <input type="email" id="fb-email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Visit Type:</label>
                    <label><input type="radio" name="visit_type" value="Dine-in" checked> Dine-in</label>
                    <label><input type="radio" name="visit_type" value="Take-away"> Take-away</label>
                </div>

                <div class="form-group">
                    <label>Favourite Items:</label>
                    <label><input type="checkbox" name="fav" value="Kopi Tarik"> Kopi Tarik</label>
                    <label><input type="checkbox" name="fav" value="Nasi Lemak"> Nasi Lemak</label>
                    <label><input type="checkbox" name="fav" value="Teh O Ais"> Teh O Ais</label>
                </div>

                <button type="submit">Send Feedback</button>
            </form>
        </section>
    </main>

    <!-- Footer with Address and Mailto (Part 2) -->
    <footer id="contact">
        <p>&copy; 2026 e-Café Campus</p>
        <address>
            Contact us: <a href="mailto:cafe@campus.edu.my">cafe@campus.edu.my</a>
        </address>
    </footer>

</body>
</html>
